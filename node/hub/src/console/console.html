<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DT Hub Console</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);margin-bottom:20px;padding:6px 0;cursor:pointer;background:none;border:0}.back-link:hover{color:var(--cyan)}.detail-header{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px}.detail-meta{display:flex;gap:20px;flex-wrap:wrap}.detail-meta-item{font:11px var(--font-mono);color:var(--text3)}.detail-meta-item strong{color:var(--text2);font-weight:500}.device-info{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}.device-badge{font:11px var(--font-mono);padding:3px 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text2)}.live-badge{font:11px var(--font-mono);padding:3px 10px;border:1px solid rgba(0,229,255,.15);border-radius:4px;background:var(--cyan-dim);color:var(--cyan)}

.log-list{display:flex;flex-direction:column;gap:2px}.log-entry{background:var(--surface);border:1px solid transparent;border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .15s}.log-entry:hover{background:var(--surface2);border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,.2)}.log-entry.expanded{border-color:var(--cyan-mid);background:var(--surface2)}.log-entry.is-failed{border-color:rgba(255,23,68,.28);background:rgba(255,23,68,.04)}.log-entry.is-failed .log-summary{color:var(--red)}.log-row{display:grid;grid-template-columns:56px 1fr auto auto auto 28px;align-items:center;min-height:46px}.log-type{height:100%;display:flex;align-items:center;justify-content:center;padding:0 12px;font:600 10px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;text-align:center}.log-type-console{color:var(--green)}.log-type-network{color:var(--cyan)}.log-type-native{color:var(--amber)}.log-type-navigation{color:var(--purple)}.log-type-track{color:var(--orange)}.log-type-zustand,.log-type-state{color:var(--pink)}.log-type-unknown{color:var(--text3)}.log-summary-col{padding:8px 12px;min-width:0}.log-summary{font:12px var(--font-mono);color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;word-break:break-all}.log-timestamp{font:10px var(--font-mono);color:var(--text3);margin-top:2px}.log-status{padding:0 8px}.log-duration{padding:0 8px;font:10px var(--font-mono);color:var(--text3);min-width:48px;text-align:right}.log-duration.slow{color:var(--amber)}.log-type.method-get{color:#60a5fa}.log-type.method-post{color:#35c759}.log-type.method-put{color:#f5a524}.log-type.method-delete{color:#ff6b6b}.log-type.method-patch{color:#a78bfa}.method-badge.method-get{background:rgba(96,165,250,.12);color:#60a5fa}.method-badge.method-post{background:rgba(53,199,89,.12);color:#35c759}.method-badge.method-put{background:rgba(245,165,36,.12);color:#f5a524}.method-badge.method-delete{background:rgba(255,107,107,.12);color:#ff6b6b}.method-badge.method-patch{background:rgba(167,139,250,.12);color:#a78bfa}.network-hero .copy-btn{margin-left:auto;opacity:.45}.network-hero:hover .copy-btn{opacity:1;color:var(--cyan)}.detail-section-header .copy-btn,.detail-section-collapsed>summary .copy-btn{opacity:.45}.detail-section-header:hover .copy-btn,.detail-section-collapsed>summary:hover .copy-btn{opacity:1;color:var(--cyan)}.detail-section-collapsed>summary{justify-content:space-between}.badge-error{background:var(--red-dim);color:var(--red)}.badge-warn{background:var(--amber-dim);color:var(--amber)}.badge-info{background:var(--cyan-dim);color:var(--cyan)}.log-copy{padding:0 4px;opacity:0;transition:opacity .15s}.log-entry:hover .log-copy{opacity:1}.copy-btn{background:none;border:0;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 4px}.copy-btn:hover{color:var(--cyan)}.log-expand{padding:0 8px;color:var(--text3);font-size:10px;transition:transform .2s}.log-entry.expanded .log-expand{transform:rotate(90deg);color:var(--cyan)}.log-detail{display:none;border-top:1px solid var(--border)}.log-entry.expanded .log-detail{display:block}.log-detail-inner{padding:16px 18px}.detail-sections{display:flex;flex-direction:column;gap:10px}.detail-section{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);overflow:hidden}.detail-section-header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px 9px 18px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(0,229,255,.07),rgba(0,229,255,.02));position:relative}.detail-section-header::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}.detail-section-title{font:700 11px var(--font-mono);color:var(--cyan);text-transform:uppercase;letter-spacing:.1em}.detail-section-body{padding:10px 14px 10px 18px}.detail-table{width:100%;border-collapse:collapse}.detail-table tr+tr{border-top:1px solid rgba(30,45,74,.5)}.detail-table th,.detail-table td{padding:8px 0;text-align:left;vertical-align:top;font:12px var(--font-mono);line-height:1.6}.detail-table th{width:112px;color:var(--text3);font-weight:500;white-space:nowrap}.detail-table td{color:var(--text2);word-break:break-word}.value-pill{display:block;padding:8px 10px;border:1px solid rgba(42,63,102,.6);border-radius:4px;background:rgba(0,0,0,.1);font:12px/1.6 var(--font-mono);color:var(--text2);word-break:break-word}.value-list{display:flex;flex-direction:column;gap:6px}.detail-section-collapsed>summary{display:flex;align-items:center;padding:9px 14px 9px 18px;background:linear-gradient(135deg,rgba(0,229,255,.07),rgba(0,229,255,.02));cursor:pointer;font:700 11px var(--font-mono);color:var(--cyan);text-transform:uppercase;letter-spacing:.1em}.detail-section-collapsed>summary::marker{color:var(--cyan)}.network-hero{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:rgba(0,0,0,.1);font:12px/1.5 var(--font-mono);word-break:break-all}.method-badge{flex:0 0 auto;padding:3px 8px;border-radius:3px;background:var(--cyan-dim);color:var(--cyan);font:700 11px var(--font-mono)}.network-meta{display:flex;gap:10px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid rgba(30,45,74,.5);font:11px var(--font-mono);color:var(--text3)}.json-block{margin:0;padding:12px 14px;max-height:480px;overflow:auto;background:rgba(0,0,0,.16);font:11px/1.7 var(--font-mono);color:var(--text2);white-space:pre;word-break:normal}.json-key{color:#8cc8ff}.json-string{color:#b8f3c6}.json-number{color:#c4b5fd}.json-boolean{color:#8cc8ff}.json-null{color:#ff6b6b}.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:14px;color:var(--text3);font:11px var(--font-mono);flex-wrap:wrap}.page-btn{padding:4px 9px;border:1px solid var(--border2);border-radius:4px;background:var(--surface);color:var(--text2);font:11px var(--font-mono);cursor:pointer}.page-btn:disabled{opacity:.4;cursor:not-allowed}.page-btn:hover:not(:disabled){color:v @media(max-width:700px){header{height:auto;min-height:56px;padding:10px 16px;align-items:flex-start;gap:10px}.header-right{flex-wrap:wrap;justify-content:flex-end}.header-select{width:150px;max-width:46vw}.container{padding:16px}.device-card{grid-template-columns:1fr;gap:8px}.log-row{grid-template-columns:52px 1fr auto auto 28px}.log-duration{display:none}.log-copy{display:none}.toolbar{gap:8px}.search-wrap{min-width:120px;flex-basis:100%}.detail-header{padding:14px 16px}}

<body>
<header>
  <div class="header-left"><div class="pulse" id="pulseDot"></div><h1>DT Hub <span id="hubVersion"></span></h1></div>
  <div class="header-right">
    <select class="header-select" id="appSelect" aria-label="App"><option>Loading…</option></select>
    <span class="header-meta" id="storageText"></span>
    <button class="btn" id="refreshBtn">↻ Refresh</button>
  </div>
</header>
<main class="container" id="app"></main>
<div class="toast" id="toast"></div>
<script>
(() => {
  'use strict';
  const BASE = window.location.origin;
  const PAGE_SIZE = 200;
  const state = { appId: '', sessions: [], sessionId: null, session: null, events: [], selectedType: '', failedOnly: false, search: '', page: 1, stream: null, maxSequence: 0, pendingLiveUpdates: 0 };
  const $ = selector => document.querySelector(selector);
  const app = $('#app');

  function esc(value) { const node = document.createElement('div'); node.textContent = String(value ?? ''); return node.innerHTML; }
  function stringify(value) { try { return JSON.stringify(value, null, 2); } catch { return String(value); } }
  function formatJson(value) { if (typeof value === 'string') { try { return JSON.stringify(JSON.parse(value), null, 2); } catch { return value; } } if (value === undefined) return ''; return stringify(value); }
  function highlightJson(text) { return esc(text).replace(/("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(?:\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)/g, match => { let cls = 'json-number'; if (match[0] === '"') cls = /:\s*$/.test(match) ? 'json-key' : 'json-string'; else if (match === 'true' || match === 'false') cls = 'json-boolean'; else if (match === 'null') cls = 'json-null'; return '<span class="' + cls + '">' + match + '</span>'; }); }
  function api(path) { return fetch(BASE + path, { cache: 'no-store' }).then(async response => { const body = await response.json().catch(() => null); if (!response.ok) throw new Error(body?.error?.message || response.statusText); return body; }); }
  function formatTime(value) { if (!value) return '-'; const date = new Date(value); return Number.isNaN(date.getTime()) ? '-' : date.toLocaleString(undefined, { hour12: false }); }
  function formatTimeShort(value) { if (!value) return ''; const date = new Date(value); return Number.isNaN(date.getTime()) ? '' : date.toLocaleTimeString(undefined, { hour12: false }); }
  function formatAge(value) { const ms = Date.now() - new Date(value).getTime(); if (!Number.isFinite(ms)) return ''; const seconds = Math.max(0, Math.floor(ms / 1000)); if (seconds < 60) return seconds + 's ago'; if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago'; if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago'; return Math.floor(seconds / 86400) + 'd ago'; }
  function formatBytes(bytes) { if (bytes < 1024) return bytes + ' B'; if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB'; if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB'; return (bytes / 1073741824).toFixed(2) + ' GB'; }
  function typeLabel(type) { const labels = { console: 'Console', network: 'Network', navigation: 'Navigation', track: 'Track', zustand: 'State', native: 'Native' }; return labels[type] || (type ? type.charAt(0).toUpperCase() + type.slice(1) : 'Unknown'); }
  function typeClass(type) { return String(type || 'unknown').replace(/[^a-z0-9_-]/gi, '_').toLowerCase(); }
  function deviceLabel(session) { const device = session.device || {}; const parts = []; if (device.platform) parts.push(device.platform === 'ios' ? 'iOS' : device.platform === 'android' ? 'Android' : device.platform); const model = [device.manufacturer, device.model].filter(Boolean).join(' '); if (model) parts.push(model); if (session.sourceIp) parts.push(session.sourceIp); if (device.osVersion) parts.push('OS ' + device.osVersion); if (device.appVersion) parts.push('v' + device.appVersion + (device.buildNumber ? ' (' + device.buildNumber + ')' : '')); return parts.join(' · ') || 'Unknown device'; }
  function formatUrlParts(url) { try { const parsed = new URL(url); return { host: parsed.host, path: parsed.pathname + parsed.search }; } catch { return { host: '', path: url || '—' }; } }
  function quoteCurl(value) { return String(value).replace(/'/g, "'\\''"); }
  function buildCurl(request) { let command = "curl -X " + (request.method || 'GET') + " '" + quoteCurl(request.url || '') + "'"; if (request.headers) Object.entries(request.headers).forEach(([key, value]) => { command += " \\\n  -H '" + quoteCurl(key) + ': ' + quoteCurl(value) + "'"; }); if (request.body != null && request.body !== '') { command += " \\\n  -d '" + quoteCurl(typeof request.body === 'string' ? request.body : stringify(request.body)) + "'"; } return command; }
  function copyPayload(event, kind) { if (!event) return ''; const data = isRecord(event.data) ? event.data : { value: event.data }; const request = isRecord(data.request) ? data.request : data; const response = isRecord(data.response) ? data.response : null; if (kind === 'url') return request.url || ''; if (kind === 'request') return request.body == null ? '' : formatJson(request.body); if (kind === 'response') return response && response.data != null ? formatJson(response.data) : data.error ? String(data.error) : ''; if (kind === 'curl') return buildCurl(request); if (kind === 'message') { const messages = Array.isArray(data.data) ? data.data : data.data !== undefined ? [data.data] : [data.message]; return messages.filter(value => value !== undefined).map(value => typeof value === 'string' ? value : formatJson(value)).join('\n'); } return stringify(event); }
  function copyButton(kind, sequence, label) { return '<button type="button" class="copy-btn" data-copy-kind="' + esc(kind) + '" data-copy-sequence="' + sequence + '" title="Copy ' + esc(label) + '">⧉</button>'; }
  function summary(event) { const data = event.data || {}; if (event.type === 'network') { const request = data.request || data; if (request.method || request.url) return formatUrlParts(request.url || '').path; } if (event.type === 'console') { const values = Array.isArray(data.data) ? data.data : data.data !== undefined ? [data.data] : [data.message]; return values.filter(value => value !== undefined).map(value => typeof value === 'string' ? value : stringify(value)).join(' ').slice(0, 240); } if (event.type === 'navigation') return [data.from || data.path, data.to].filter(Boolean).join(' → '); if (event.type === 'track') return data.eventName || data.event || data.name || 'Track event'; if (event.type === 'zustand') return data.action || data.storeName || 'State change'; if (event.type === 'native') return [data.tag, data.message].filter(Boolean).join(': ') || 'Native log'; return data.message || data.text || stringify(data).slice(0, 240); }
  function isFailed(event) { const data = event.data || {}; if (event.type === 'network') { const response = isRecord(data.response) ? data.response : data; const status = Number(response && response.status); if (Number.isFinite(status) && status > 0) return status >= 400; return Boolean(data.error); } return event.severity === 'error' || event.severity === 'fatal' || Boolean(data.error) || Number((data.response || {}).status) >= 400; }
  function networkStatusLabel(event) { const data = event.data || {}; const response = isRecord(data.response) ? data.response : data; const status = Number(response && response.status); if (Number.isFinite(status) && status > 0) return String(status); if (data.error === 'Timeout') return 'Timeout'; if (data.error === 'Aborted') return 'Abort'; if (data.error === 'Network Error') return 'NetErr'; return data.error ? 'ERR' : '…'; }
  function statusBadge(event) { if (event.type === 'network') { const data = event.data || {}; const response = isRecord(data.response) ? data.response : data; const status = Number(response && response.status); const failed = Number.isFinite(status) && status > 0 ? status >= 400 : Boolean(data.error); return '<span class="badge ' + (failed ? 'badge-error' : 'badge-info') + '">' + esc(networkStatusLabel(event)) + '</span>'; } if (event.severity === 'error' || event.severity === 'fatal') return '<span class="badge badge-error">ERR</span>'; if (event.severity === 'warn') return '<span class="badge badge-warn">WRN</span>'; return '<span class="badge badge-info">' + esc(event.severity || 'info') + '</span>'; }

  function isRecord(value) { return value !== null && typeof value === 'object' && !Array.isArray(value); }
  function renderValue(value) {
    if (value === undefined || value === null) return '<span class="value-pill">—</span>';
    if (typeof value === 'number' || typeof value === 'boolean') return '<span class="value-pill">' + esc(value) + '</span>';
    const formatted = formatJson(value);
    if (typeof value === 'string' && formatted === value) {
      if (value.length > 120) return '<pre class="json-block">' + esc(value) + '</pre>';
      return '<span class="value-pill">' + esc(value) + '</span>';
    }
    return '<pre class="json-block">' + highlightJson(formatted) + '</pre>';
  }
  function renderRows(rows) {
    const visibleRows = rows.filter(row => row[1] !== undefined && row[1] !== null && row[1] !== '');
    if (!visibleRows.length) return '<span class="value-pill">—</span>';
    return '<table class="detail-table"><tbody>' + visibleRows.map(row => '<tr><th>' + esc(row[0]) + '</th><td>' + renderValue(row[1]) + '</td></tr>').join('') + '</tbody></table>';
  }
  function renderSection(title, content, copy) {
    return '<section class="detail-section"><div class="detail-section-header"><span class="detail-section-title">' + esc(title) + '</span>' + (copy || '') + '</div><div class="detail-section-body">' + content + '</div></section>';
  }
  function renderCollapsedSection(title, content, copy) {
    return '<details class="detail-section detail-section-collapsed"><summary><span>' + esc(title) + '</span>' + (copy || '') + '</summary><div class="detail-section-body">' + content + '</div></details>';
  }
  function renderConsoleData(data, event) {
    const messages = Array.isArray(data.data) ? data.data : data.data !== undefined ? [data.data] : [data.message];
    const copy = event ? copyButton('message', event.sequence, 'Messages') : '';
    return renderSection('Console', renderRows([['Level', data.level]])) + renderSection('Messages', '<div class="value-list">' + messages.map(renderValue).join('') + '</div>', copy);
  }
  function renderNativeData(data) {
    return renderSection('Native log', renderRows([
      ['Level', data.level], ['Platform', data.platform], ['Source', data.source], ['Tag', data.tag],
      ['Thread', data.thread], ['File', data.file], ['Line', data.line],
    ])) + renderSection('Message', renderValue(data.message || data.raw || '')) + (data.raw ? renderCollapsedSection('Raw native log', renderValue(data.raw)) : '');
  }
  function renderNetworkData(data, event) {
    const request = isRecord(data.request) ? data.request : data;
    const response = isRecord(data.response) ? data.response : null;
    const method = String(request.method || 'GET').toUpperCase();
    const sequence = event ? event.sequence : '';
    const copy = kind => sequence === '' ? '' : copyButton(kind, sequence, kind);
    let html = '<section class="detail-section"><div class="network-hero"><span class="method-badge method-' + method.toLowerCase() + '">' + esc(method) + '</span><span>' + esc(request.url || '—') + '</span>' + copy('url') + '</div>';
    const metadata = [];
    if (response && response.status !== undefined) metadata.push(response.status + (response.statusText ? ' ' + response.statusText : ''));
    if (data.duration !== undefined) metadata.push(data.duration + 'ms');
    if (data.error) metadata.push('Error: ' + data.error);
    if (metadata.length) html += '<div class="network-meta">' + metadata.map(esc).join('<span>·</span>') + '</div>';
    html += '</section>';
    html += renderSection('Request body', renderValue(request.body), copy('request'));
    if (response || data.error) html += renderSection('Response data', renderValue(response ? response.data : data.error), copy('response'));
    if (request.headers) html += renderCollapsedSection('Request headers', renderValue(request.headers));
    if (response && response.headers) html += renderCollapsedSection('Response headers', renderValue(response.headers));
    html += renderCollapsedSection('cURL', '<pre class="json-block">' + esc(buildCurl(request)) + '</pre>', copy('curl'));
    return html;
  }
  function renderNavigationData(data) {
    const route = [data.from || data.path, data.to].filter(Boolean).join(' → ') || '—';
    return renderSection('Navigation', renderRows([['Route', route], ['Action', data.action], ['Duration', data.duration !== undefined ? data.duration + 'ms' : undefined]]));
  }
  function renderTrackData(data) {
    const properties = {};
    Object.entries(data).forEach(([key, value]) => { if (!['id', 'timestamp', 'eventName', 'event', 'name'].includes(key)) properties[key] = value; });
    return renderSection('Event', renderRows([['Name', data.eventName || data.event || data.name]])) + renderSection('Properties', renderValue(properties));
  }
  function renderZustandData(data) {
    return renderSection('State change', renderRows([
      ['Store', data.storeName], ['Action', data.action], ['Duration', data.actionCompleteTime !== undefined ? data.actionCompleteTime + 'ms' : undefined],
    ])) + renderCollapsedSection('Previous state', renderValue(data.prevState)) + renderSection('Next state', renderValue(data.nextState));
  }
  function renderEventData(event) {
    const data = isRecord(event.data) ? event.data : { value: event.data };
    if (event.type === 'console') return renderConsoleData(data, event);
    if (event.type === 'native') return renderNativeData(data);
    if (event.type === 'network') return renderNetworkData(data, event);
    if (event.type === 'navigation') return renderNavigationData(data);
    if (event.type === 'track') return renderTrackData(data);
    if (event.type === 'zustand') return renderZustandData(data);
    return renderSection('Data', renderValue(data));
  }
  function renderEventDetails(event) {
    const metadata = renderRows([
      ['Type', typeLabel(event.type)], ['Severity', event.severity], ['Sequence', event.sequence],
      ['Event time', formatTime(event.timestamp)], ['Received', formatTime(event.receivedAt)],
    ]);
    return '<div class="detail-sections">' + renderEventData(event) + renderCollapsedSection('Event metadata', metadata) + renderCollapsedSection('Raw event', renderValue(event)) + '</div>';
  }
  function showToast(message) { const toast = $('#toast'); toast.textContent = message; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1800); }

  function renderList() {
    closeStream();
    state.sessionId = null; state.session = null; state.events = []; state.pendingLiveUpdates = 0;
    if (!state.appId) { app.innerHTML = '<div class="empty"><div class="empty-icon">_</div><p>No Apps connected yet.</p></div>'; return; }
    if (!state.sessions.length) { app.innerHTML = '<div class="empty"><div class="empty-icon">_</div><p>No device logs received yet.</p><p style="margin-top:12px;font-size:13px">Open the App and generate a log; it syncs automatically.</p></div>'; return; }
    let html = '<div class="section-title">Devices <span style="color:var(--text3);font-weight:400">(' + state.sessions.length + ')</span></div><div class="device-grid">';
    state.sessions.forEach(session => {
      const active = session.connectionState === 'active';
      const sync = session.syncState === 'paused' ? 'paused' : 'live';
      html += '<button type="button" class="device-card" data-session-id="' + esc(session.sessionId) + '"><div><div class="device-title">' + esc(deviceLabel(session)) + '</div></div><div><div class="device-meta-line"><strong>Last seen</strong>' + esc(formatTime(session.lastSeenAt)) + '</div></div><div class="device-tags"><span class="tag tag-' + (active ? 'live' : 'paused') + '">' + esc(sync) + '</span></div><div class="device-arrow">›</div></button>';
    });
    app.innerHTML = html + '</div>';
    app.querySelectorAll('[data-session-id]').forEach(card => card.addEventListener('click', () => openSession(card.dataset.sessionId)));
  }

  function countsByType() { return state.events.reduce((counts, event) => { counts[event.type] = (counts[event.type] || 0) + 1; return counts; }, {}); }
  function filteredEvents() { const term = state.search.toLowerCase(); return state.events.filter(event => (!state.selectedType || event.type === state.selectedType) && (!state.failedOnly || isFailed(event)) && (!term || (summary(event) + ' ' + stringify(event.data)).toLowerCase().includes(term))).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)); }
  function renderLogEntry(event) {
    const data = event.data || {};
    const failed = isFailed(event);
    let typeHtml = '<div class="log-type log-type-' + typeClass(event.type) + '">' + esc(typeLabel(event.type)) + '</div>';
    let meta = formatTimeShort(event.receivedAt || event.timestamp);
    let durationHtml = '<div class="log-duration"></div>';
    let copyKind = event.type === 'console' ? 'message' : 'event';
    if (event.type === 'network') {
      const request = isRecord(data.request) ? data.request : data;
      const method = String(request.method || 'GET').toUpperCase();
      const parts = formatUrlParts(request.url || '');
      typeHtml = '<div class="log-type log-type-network method-' + method.toLowerCase() + '">' + esc(method) + '</div>';
      if (parts.host) meta = parts.host + (meta ? ' · ' + meta : '');
      if (data.duration != null) durationHtml = '<div class="log-duration' + (Number(data.duration) >= 1000 ? ' slow' : '') + '">' + esc(data.duration) + 'ms</div>';
      copyKind = (data.response && data.response.data != null) || data.error ? 'response' : 'url';
    }
    return '<article class="log-entry' + (failed ? ' is-failed' : '') + '" id="entry-' + event.sequence + '"><div class="log-row">' + typeHtml + '<div class="log-summary-col"><div class="log-summary">' + esc(summary(event)) + '</div><div class="log-timestamp">' + esc(meta) + '</div></div><div class="log-status">' + statusBadge(event) + '</div>' + durationHtml + '<div class="log-copy"><button type="button" class="copy-btn" data-copy-kind="' + copyKind + '" data-copy-sequence="' + event.sequence + '" title="Copy">⧉</button></div><div class="log-expand" data-collapse title="Toggle details">›</div></div><div class="log-detail"><div class="log-detail-inner">' + renderEventDetails(event) + '</div></div></article>';
  }
  function bindLogEntry(entry) {
    entry.querySelector('.log-row').addEventListener('click', event => { if (event.target.closest('[data-copy-kind]')) return; entry.classList.toggle('expanded'); });
    entry.querySelectorAll('[data-copy-kind]').forEach(button => button.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      const item = state.events.find(value => String(value.sequence) === button.dataset.copySequence);
      copyText(copyPayload(item, button.dataset.copyKind));
    }));
  }
  function updateLiveUpdateButton() { const button = $('#liveUpdateButton'); if (!button) return; button.hidden = state.pendingLiveUpdates === 0; button.textContent = state.pendingLiveUpdates + ' new log' + (state.pendingLiveUpdates === 1 ? '' : 's') + ' · Show'; }
  function updateLiveCounters() { const counts = countsByType(); const filtered = filteredEvents(); const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE)); const start = (state.page - 1) * PAGE_SIZE; const entries = $('#entryCount'); if (entries) entries.textContent = state.events.length; app.querySelectorAll('.tab').forEach(tab => { const count = tab.querySelector('.count'); if (count) count.textContent = tab.dataset.type ? (counts[tab.dataset.type] || 0) : state.events.length; }); const range = $('#pagerRange'); if (range) range.textContent = (filtered.length ? start + 1 : 0) + '-' + Math.min(start + PAGE_SIZE, filtered.length) + ' / ' + filtered.length; const page = $('#pagerPage'); if (page) page.textContent = state.page + ' / ' + pages; const previous = $('#previousPage'); if (previous) { previous.disabled = state.page <= 1; previous.dataset.page = state.page - 1; } const next = $('#nextPage'); if (next) { next.disabled = state.page >= pages; next.dataset.page = state.page + 1; } }
  function refreshLogList() {
    const mount = $('#logMount');
    if (!mount) return;
    const expanded = new Set([...app.querySelectorAll('.log-entry.expanded')].map(entry => entry.id));
    const filtered = filteredEvents();
    const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    state.page = Math.min(Math.max(1, state.page), pages);
    const start = (state.page - 1) * PAGE_SIZE;
    const visible = filtered.slice(start, start + PAGE_SIZE);
    if (!visible.length) {
      mount.innerHTML = '<div class="empty" style="padding:40px"><div class="empty-icon" style="font-size:24px">0</div><p>No logs match filters.</p></div>';
    } else {
      mount.innerHTML = '<div class="log-list">' + visible.map(renderLogEntry).join('') + '</div>';
      mount.querySelectorAll('.log-entry').forEach(entry => {
        bindLogEntry(entry);
        if (expanded.has(entry.id)) entry.classList.add('expanded');
      });
    }
    updateLiveCounters();
  }
  function insertVisibleLiveRow(event) { if (state.page !== 1) return false; const visible = filteredEvents().slice(0, PAGE_SIZE); const position = visible.findIndex(value => value.sequence === event.sequence); if (position < 0) return false; const mount = $('#logMount'); if (!mount) return false; let list = mount.querySelector('.log-list'); if (!list) { mount.innerHTML = '<div class="log-list"></div>'; list = mount.querySelector('.log-list'); } list.insertAdjacentHTML('beforeend', renderLogEntry(event)); const entry = $('#entry-' + event.sequence); const next = visible[position + 1]; list.insertBefore(entry, next ? $('#entry-' + next.sequence) : null); bindLogEntry(entry); if (entry.getBoundingClientRect().top < 0) window.scrollBy(0, entry.offsetHeight); while (list.children.length > visible.length) list.lastElementChild.remove(); return true; }
  function appendLiveEvent(event) { state.events.push(event); state.maxSequence = event.sequence; if (!insertVisibleLiveRow(event)) state.pendingLiveUpdates += 1; updateLiveCounters(); updateLiveUpdateButton(); }

  function renderDetail() {
    const session = state.session;
    if (!session) return renderList();
    state.pendingLiveUpdates = 0;
    const device = session.device || {}; const counts = countsByType(); const types = Object.keys(counts).sort(); const filtered = filteredEvents(); const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE)); state.page = Math.min(state.page, pages); const start = (state.page - 1) * PAGE_SIZE; const visible = filtered.slice(start, start + PAGE_SIZE);
    let html = '<button type="button" class="back-link" id="backButton">← All devices</button><section class="detail-header"><div class="detail-meta"><span class="detail-meta-item"><strong>Last seen</strong> ' + esc(formatTime(session.lastSeenAt)) + '</span><span class="detail-meta-item"><strong>Entries</strong> <span id="entryCount">' + state.events.length + '</span></span><span class="detail-meta-item"><strong>IP</strong> ' + esc(session.sourceIp || '-') + '</span></div><div class="device-info"><span class="device-badge">' + esc(device.platform || 'unknown') + '</span>' + (device.model ? '<span class="device-badge">' + esc(device.model) + '</span>' : '') + (device.osVersion ? '<span class="device-badge">OS ' + esc(device.osVersion) + '</span>' : '') + (device.appVersion ? '<span class="device-badge">v' + esc(device.appVersion) + '</span>' : '') + '<span class="live-badge">' + esc(session.syncState || 'live') + '</span></div></section>';
    html += '<nav class="tabs"><button class="tab ' + (!state.selectedType ? 'active' : '') + '" data-type="">All<span class="count">' + state.events.length + '</span></button>';
    types.forEach(type => { html += '<button class="tab ' + (state.selectedType === type ? 'active' : '') + '" data-type="' + esc(type) + '">' + esc(typeLabel(type)) + '<span class="count">' + counts[type] + '</span></button>'; });
    html += '</nav><div class="toolbar"><div class="search-wrap"><span class="search-icon">⌕</span><input class="search-input" id="searchInput" type="text" value="' + esc(state.search) + '" placeholder="Search logs..." autocomplete="off"></div><label class="toggle-label">Failed only <span id="failedToggle" class="toggle ' + (state.failedOnly ? 'on' : '') + '"></span></label><button type="button" class="btn ' + (state.stream ? 'on' : '') + '" id="liveButton" aria-pressed="' + (state.stream ? 'true' : 'false') + '" title="' + (state.stream ? 'Pause live updates' : 'Resume live updates') + '">' + (state.stream ? '● Live' : '○ Paused') + '</button><button type="button" class="btn" id="liveUpdateButton" hidden></button></div>';
    html += '<div id="logMount">';
    if (!visible.length) html += '<div class="empty" style="padding:40px"><div class="empty-icon" style="font-size:24px">0</div><p>No logs match filters.</p></div>';
    else html += '<div class="log-list">' + visible.map(renderLogEntry).join('') + '</div>';
    html += '</div>';
    html += '<div class="pager"><span id="pagerRange">' + (filtered.length ? start + 1 : 0) + '-' + Math.min(start + PAGE_SIZE, filtered.length) + ' / ' + filtered.length + '</span><button class="page-btn" id="previousPage" data-page="' + (state.page - 1) + '" ' + (state.page <= 1 ? 'disabled' : '') + '>Prev</button><span id="pagerPage">' + state.page + ' / ' + pages + '</span><button class="page-btn" id="nextPage" data-page="' + (state.page + 1) + '" ' + (state.page >= pages ? 'disabled' : '') + '>Next</button></div>';
    app.innerHTML = html;
    $('#backButton').addEventListener('click', renderList);
    app.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => { state.selectedType = tab.dataset.type || ''; state.page = 1; app.querySelectorAll('.tab').forEach(node => node.classList.toggle('active', node === tab)); refreshLogList(); }));
    $('#searchInput').addEventListener('input', event => { state.search = event.target.value; state.page = 1; refreshLogList(); });
    $('#failedToggle').addEventListener('click', () => { state.failedOnly = !state.failedOnly; state.page = 1; $('#failedToggle').classList.toggle('on', state.failedOnly); refreshLogList(); });
    $('#liveButton').addEventListener('click', () => { if (state.stream) closeStream(); else startStream(); renderDetail(); });
    $('#liveUpdateButton').addEventListener('click', () => { state.pendingLiveUpdates = 0; state.page = 1; refreshLogList(); updateLiveUpdateButton(); });
    app.querySelectorAll('.log-entry').forEach(bindLogEntry);
    app.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click', () => { state.page = Number(button.dataset.page); refreshLogList(); }));
  }

  async function openSession(sessionId) {
    const session = state.sessions.find(value => value.sessionId === sessionId); if (!session) return; closeStream(); state.sessionId = sessionId; state.session = session; state.events = []; state.selectedType = ''; state.failedOnly = false; state.search = ''; state.page = 1; state.pendingLiveUpdates = 0; app.innerHTML = '<div class="empty"><div class="empty-icon">…</div><p>Loading logs…</p></div>';
    try { const result = await api('/api/v1/apps/' + encodeURIComponent(state.appId) + '/sessions/' + encodeURIComponent(sessionId) + '/events?limit=500'); state.events = result.events || []; state.maxSequence = state.events.reduce((max, event) => Math.max(max, event.sequence || 0), 0); renderDetail(); startStream(); renderDetail(); } catch (error) { app.innerHTML = '<div class="empty" style="color:var(--red)">Failed to load logs: ' + esc(error.message) + '</div>'; }
  }

  function startStream() { if (!state.appId || !state.sessionId || state.stream) return; const stream = new EventSource(BASE + '/api/v1/apps/' + encodeURIComponent(state.appId) + '/sessions/' + encodeURIComponent(state.sessionId) + '/stream'); state.stream = stream; stream.addEventListener('event', message => { try { const event = JSON.parse(message.data); if (event.sequence > state.maxSequence) appendLiveEvent(event); } catch {} }); stream.onerror = () => { /* EventSource reconnects itself. */ }; }
  function closeStream() { if (state.stream) { state.stream.close(); state.stream = null; } }
  function copyText(text) { navigator.clipboard?.writeText(text).then(() => showToast('Copied to clipboard')).catch(() => showToast('Copy unavailable')); }

  async function loadApps(preserveView) {
    try { const ready = await api('/ready'); $('#hubVersion').textContent = ready.version ? 'v' + ready.version : ''; $('#storageText').textContent = ready.storage ? formatBytes(ready.storage.usedBytes) + ' / ' + formatBytes(ready.storage.limitBytes) : ''; $('#pulseDot').classList.remove('off'); const apps = ready.apps || []; const select = $('#appSelect'); const selected = apps.includes(state.appId) ? state.appId : apps[0] || ''; state.appId = selected; select.innerHTML = apps.length ? apps.map(appId => '<option value="' + esc(appId) + '" ' + (appId === selected ? 'selected' : '') + '>' + esc(appId) + '</option>').join('') : '<option value="">No apps</option>'; await loadSessions(preserveView); } catch (error) { $('#pulseDot').classList.add('off'); app.innerHTML = '<div class="empty" style="color:var(--red)">Connection failed: ' + esc(error.message) + '</div>'; } }
  async function loadSessions(preserveView) { if (!state.appId) { state.sessions = []; renderList(); return; } try { const result = await api('/api/v1/apps/' + encodeURIComponent(state.appId) + '/sessions'); state.sessions = result.sessions || []; if (preserveView && state.sessionId) { const current = state.sessions.find(value => value.sessionId === state.sessionId); if (current) { state.session = current; return; } } renderList(); } catch (error) { app.innerHTML = '<div class="empty" style="color:var(--red)">Failed to load devices: ' + esc(error.message) + '</div>'; } }

  $('#appSelect').addEventListener('change', event => { state.appId = event.target.value; state.sessionId = null; loadSessions(false); });
  $('#refreshBtn').addEventListener('click', () => { if (state.sessionId) openSession(state.sessionId); else loadApps(false); });
  window.addEventListener('beforeunload', closeStream);
  loadApps(false);
})();
</script>
</body>
</html>
