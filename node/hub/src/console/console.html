<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DT Hub Console</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080c16;--bg2:#0d1220;--surface:#111827;--surface2:#1a2236;--surface3:#222d44;
  --border:#1e2d4a;--border2:#2a3f66;
  --text:#e2e8f0;--text2:#8899b4;--text3:#5a6e8a;
  --cyan:#00e5ff;--cyan-dim:rgba(0,229,255,.12);--cyan-mid:rgba(0,229,255,.25);
  --green:#00e676;--green-dim:rgba(0,230,118,.12);
  --red:#ff1744;--red-dim:rgba(255,23,68,.12);
  --amber:#ffab00;--amber-dim:rgba(255,171,0,.12);
  --font-mono:'SF Mono',Monaco,Consolas,monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --radius:6px;
}
html{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
body{
  font-family:var(--font-sans);background:var(--bg);color:var(--text);
  line-height:1.5;min-height:100vh;display:flex;flex-direction:column;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,255,.012) 2px,rgba(0,229,255,.012) 4px);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent 0px,transparent 1px,rgba(0,0,0,.03) 1px,rgba(0,0,0,.03) 2px);
}

header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:52px;
  background:linear-gradient(180deg,var(--bg2) 0%,rgba(13,18,32,.95) 100%);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);flex-shrink:0;
}
.h-left{display:flex;align-items:center;gap:12px}
.pulse{
  width:8px;height:8px;border-radius:50%;background:var(--cyan);flex-shrink:0;
  box-shadow:0 0 8px var(--cyan),0 0 16px rgba(0,229,255,.3);
  animation:pulse 2s ease-in-out infinite;
}
.pulse.off{background:var(--red);box-shadow:0 0 8px var(--red);animation:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
header h1{font-size:15px;font-weight:600;color:var(--text)}
header h1 span{color:var(--text3);font-weight:400;font-size:12px;margin-left:6px}
.h-right{display:flex;align-items:center;gap:12px}
.h-meta{font-size:11px;font-family:var(--font-mono);color:var(--text3)}
.storage-bar{width:100px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.storage-fill{height:100%;background:var(--cyan);border-radius:3px;transition:width .3s}
.storage-fill.warn{background:var(--amber)}
.storage-fill.crit{background:var(--red)}

.layout{display:flex;flex:1;overflow:hidden}
.sidebar{
  width:280px;min-width:280px;border-right:1px solid var(--border);
  display:flex;flex-direction:column;background:var(--bg2);overflow:hidden;
}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

.sb-section{padding:10px 12px;border-bottom:1px solid var(--border)}
.sb-section label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);display:block;margin-bottom:6px}
select,input[type=text]{
  width:100%;padding:6px 10px;font-size:12px;font-family:var(--font-sans);
  background:var(--surface);color:var(--text);border:1px solid var(--border);
  border-radius:var(--radius);outline:none;
}
select:focus,input:focus{border-color:var(--cyan-mid)}

.session-list{flex:1;overflow-y:auto;padding:6px}
.session-card{
  padding:10px 12px;border-radius:var(--radius);cursor:pointer;
  border:1px solid transparent;margin-bottom:4px;transition:all .15s;
}
.session-card:hover{background:var(--surface);border-color:var(--border)}
.session-card.active{background:var(--cyan-dim);border-color:var(--cyan-mid)}
.sc-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sc-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.sc-dot.off{background:var(--text3)}
.sc-label{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sc-meta{font-size:10px;color:var(--text3);font-family:var(--font-mono);display:flex;gap:8px;flex-wrap:wrap}
.sc-sync{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:500}
.sc-sync.live{background:var(--green-dim);color:var(--green)}
.sc-sync.paused{background:var(--amber-dim);color:var(--amber)}

.toolbar{
  display:flex;align-items:center;gap:8px;padding:8px 16px;
  border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;
}
.toolbar select{width:auto;min-width:100px}
.toolbar input[type=text]{flex:1;min-width:120px}
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;font-size:11px;font-weight:500;
  border:1px solid var(--border2);border-radius:var(--radius);
  background:var(--surface2);color:var(--text2);cursor:pointer;
  font-family:var(--font-sans);transition:all .15s;white-space:nowrap;
}
.btn:hover{background:var(--surface3);color:var(--text);border-color:var(--cyan-mid)}
.btn.on{background:var(--cyan-dim);color:var(--cyan);border-color:var(--cyan-mid)}

.timeline{flex:1;overflow-y:auto;padding:8px 16px}
.ev{
  display:flex;align-items:flex-start;gap:10px;padding:7px 10px;
  border-radius:var(--radius);cursor:pointer;transition:background .1s;
  font-size:12px;border:1px solid transparent;
}
.ev:hover{background:var(--surface);border-color:var(--border)}
.ev-time{font-family:var(--font-mono);font-size:10px;color:var(--text3);min-width:72px;padding-top:2px;flex-shrink:0}
.ev-badge{
  font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  padding:2px 6px;border-radius:3px;flex-shrink:0;min-width:52px;text-align:center;
}
.ev-badge.console{background:var(--cyan-dim);color:var(--cyan)}
.ev-badge.network{background:rgba(124,77,255,.15);color:#7c4dff}
.ev-badge.navigation{background:rgba(255,171,0,.15);color:var(--amber)}
.ev-badge.state{background:rgba(0,230,118,.15);color:var(--green)}
.ev-badge.native{background:rgba(255,110,64,.15);color:#ff6e40}
.ev-badge.lifecycle{background:rgba(224,64,251,.15);color:#e040fb}
.ev-badge.marker{background:rgba(0,229,255,.15);color:var(--cyan)}
.ev-sev{font-size:9px;font-weight:600;padding:2px 5px;border-radius:3px;min-width:36px;text-align:center;flex-shrink:0}
.ev-sev.error,.ev-sev.fatal{background:var(--red-dim);color:var(--red)}
.ev-sev.warn{background:var(--amber-dim);color:var(--amber)}
.ev-sev.info{background:var(--cyan-dim);color:var(--cyan)}
.ev-sev.debug{background:var(--surface2);color:var(--text3)}
.ev-text{flex:1;color:var(--text2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ev-seq{font-family:var(--font-mono);font-size:10px;color:var(--text3);flex-shrink:0}

.detail-panel{
  position:fixed;top:52px;right:0;bottom:0;width:480px;
  background:var(--bg2);border-left:1px solid var(--border);
  z-index:50;transform:translateX(100%);transition:transform .2s ease;
  display:flex;flex-direction:column;
}
.detail-panel.open{transform:translateX(0)}
.dp-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.dp-header h3{font-size:13px;font-weight:600}
.dp-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px}
.dp-close:hover{color:var(--text)}
.dp-body{flex:1;overflow-y:auto;padding:16px}
.dp-body pre{
  font-family:var(--font-mono);font-size:11px;line-height:1.6;color:var(--text2);
  white-space:pre-wrap;word-break:break-all;
}

.empty{display:flex;align-items:center;justify-content:center;flex:1;color:var(--text3);font-size:13px}

.live-dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1s infinite}
</style>
</head>
<body>

<header>
  <div class="h-left">
    <div class="pulse" id="statusDot"></div>
    <h1>DT Hub<span id="hubVersion"></span></h1>
  </div>
  <div class="h-right">
    <span class="h-meta" id="hubRef"></span>
    <div class="storage-bar"><div class="storage-fill" id="storageFill"></div></div>
    <span class="h-meta" id="storageText"></span>
  </div>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sb-section">
      <label>App</label>
      <select id="appSelect"><option value="">Loading…</option></select>
    </div>
    <div class="session-list" id="sessionList">
      <div class="empty">Select an app</div>
    </div>
  </div>

  <div class="main">
    <div class="toolbar">
      <select id="filterType"><option value="">All types</option></select>
      <select id="filterSev">
        <option value="">All severity</option>
        <option value="fatal">Fatal</option>
        <option value="error">Error</option>
        <option value="warn">Warn</option>
        <option value="info">Info</option>
        <option value="debug">Debug</option>
      </select>
      <input type="text" id="filterText" placeholder="Search events…">
      <button class="btn" id="liveBtn">● Live</button>
      <button class="btn" id="refreshBtn">↻</button>
    </div>
    <div class="timeline" id="timeline">
      <div class="empty">Select a session to view events</div>
    </div>
  </div>
</div>

<div class="detail-panel" id="detailPanel">
  <div class="dp-header">
    <h3 id="detailTitle">Event Detail</h3>
    <button class="dp-close" id="detailClose">✕</button>
  </div>
  <div class="dp-body"><pre id="detailBody"></pre></div>
</div>

<script>
const BASE = window.location.origin;
const $ = s => document.querySelector(s);
const state = { appId: null, sessionId: null, events: [], sse: null, liveMode: false, autoScroll: true };

async function api(path) {
  const r = await fetch(BASE + path);
  if (!r.ok) throw Object.assign(new Error(r.statusText), { status: r.status, body: await r.json().catch(() => null) });
  return r.json();
}

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
}

function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function fmtTimeAgo(ts) {
  if (!ts) return '';
  const s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function deviceLabel(dev, ctrl) {
  const parts = [];
  if (dev?.platform) parts.push(dev.platform);
  if (dev?.model) parts.push(dev.model);
  if (ctrl?.sourceIp) parts.push(ctrl.sourceIp);
  if (dev?.appVersion) parts.push('v' + dev.appVersion);
  return parts.join(' · ') || 'Unknown device';
}

async function checkReady() {
  try {
    const d = await api('/ready');
    $('#statusDot').classList.remove('off');
    $('#hubVersion').textContent = d.version ? ' v' + d.version : '';
    $('#hubRef').textContent = d.hubRef || '';
    if (d.storage) {
      const pct = d.storage.limitBytes > 0 ? (d.storage.usedBytes / d.storage.limitBytes) * 100 : 0;
      const fill = $('#storageFill');
      fill.style.width = Math.min(pct, 100) + '%';
      fill.className = 'storage-fill' + (pct > 90 ? ' crit' : pct > 70 ? ' warn' : '');
      $('#storageText').textContent = fmtBytes(d.storage.usedBytes) + ' / ' + fmtBytes(d.storage.limitBytes);
    }
  } catch {
    $('#statusDot').classList.add('off');
    $('#hubVersion').textContent = ' offline';
  }
}

async function loadApps() {
  const sel = $('#appSelect');
  try {
    const d = await api('/ready');
    const apps = d.apps || [];
    sel.innerHTML = apps.length
      ? apps.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('')
      : '<option value="">No apps</option>';
    if (apps.length) {
      state.appId = apps[0];
      loadSessions();
    }
  } catch {
    sel.innerHTML = '<option value="">Unable to load</option>';
  }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function loadSessions() {
  const list = $('#sessionList');
  if (!state.appId) { list.innerHTML = '<div class="empty">Select an app</div>'; return; }
  try {
    const d = await api(`/api/v1/apps/${encodeURIComponent(state.appId)}/sessions`);
    const sessions = d.sessions || [];
    if (!sessions.length) { list.innerHTML = '<div class="empty">No sessions</div>'; return; }
    list.innerHTML = sessions.map(s => {
      const ctrl = s;
      const dev = s.device || {};
      const isActive = ctrl.connectionState === 'active';
      const selected = state.sessionId === ctrl.sessionId;
      return `<div class="session-card${selected ? ' active' : ''}" data-sid="${esc(ctrl.sessionId)}">
        <div class="sc-top">
          <div class="sc-dot ${isActive ? 'on' : 'off'}"></div>
          <div class="sc-label">${esc(deviceLabel(dev, ctrl))}</div>
          ${ctrl.syncState ? `<span class="sc-sync ${ctrl.syncState === 'live' ? 'live' : 'paused'}">${esc(ctrl.syncState)}</span>` : ''}
        </div>
        <div class="sc-meta">
          <span>${esc(ctrl.sessionRef || ctrl.sessionId?.slice(0, 8) || '')}</span>
          <span>${fmtTimeAgo(ctrl.lastSeenAt)}</span>
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('.session-card').forEach(c => c.onclick = () => selectSession(c.dataset.sid));
  } catch {
    list.innerHTML = '<div class="empty">Failed to load sessions</div>';
  }
}

function selectSession(sid) {
  state.sessionId = sid;
  state.events = [];
  stopSSE();
  document.querySelectorAll('.session-card').forEach(c => c.classList.toggle('active', c.dataset.sid === sid));
  loadEvents();
}

async function loadEvents() {
  const tl = $('#timeline');
  if (!state.appId || !state.sessionId) { tl.innerHTML = '<div class="empty">Select a session</div>'; return; }
  tl.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const params = new URLSearchParams();
    const type = $('#filterType').value; if (type) params.set('type', type);
    const sev = $('#filterSev').value; if (sev) params.set('severity', sev);
    const text = $('#filterText').value.trim(); if (text) params.set('text', text);
    params.set('limit', '200');
    const q = params.toString();
    const d = await api(`/api/v1/apps/${encodeURIComponent(state.appId)}/sessions/${encodeURIComponent(state.sessionId)}/events${q ? '?' + q : ''}`);
    state.events = d.events || [];
    populateTypeFilter(state.events);
    renderEvents();
  } catch (e) {
    tl.innerHTML = `<div class="empty">Error: ${esc(e.body?.error?.message || e.message)}</div>`;
  }
}

function populateTypeFilter(events) {
  const sel = $('#filterType');
  const cur = sel.value;
  const types = [...new Set(events.map(e => e.type).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All types</option>' + types.map(t => `<option value="${esc(t)}"${t === cur ? ' selected' : ''}>${esc(t)}</option>`).join('');
}

function renderEvents() {
  const tl = $('#timeline');
  if (!state.events.length) { tl.innerHTML = '<div class="empty">No events</div>'; return; }
  tl.innerHTML = state.events.map(e => {
    const type = (e.type || 'unknown').toLowerCase();
    const sev = (e.severity || 'info').toLowerCase();
    const text = e.message || e.url || e.text || JSON.stringify(e.data || e).slice(0, 200);
    return `<div class="ev" data-eid="${esc(e.entryId || '')}" data-seq="${e.sequence || ''}">
      <span class="ev-time">${fmtTime(e.receivedAt || e.clientTime)}</span>
      <span class="ev-badge ${type}">${esc(type)}</span>
      <span class="ev-sev ${sev}">${esc(sev)}</span>
      <span class="ev-text">${esc(text)}</span>
      <span class="ev-seq">#${e.sequence ?? ''}</span>
    </div>`;
  }).join('');
  tl.querySelectorAll('.ev').forEach(el => el.onclick = () => showDetail(el.dataset.eid));
  if (state.autoScroll) tl.scrollTop = tl.scrollHeight;
}

async function showDetail(entryId) {
  const panel = $('#detailPanel');
  const body = $('#detailBody');
  if (!entryId) {
    const ev = state.events.find(e => !e.entryId);
    if (ev) { body.textContent = JSON.stringify(ev, null, 2); panel.classList.add('open'); return; }
    return;
  }
  panel.classList.add('open');
  body.textContent = 'Loading…';
  $('#detailTitle').textContent = 'Entry ' + entryId.slice(0, 12);
  try {
    const d = await api(`/api/v1/apps/${encodeURIComponent(state.appId)}/sessions/${encodeURIComponent(state.sessionId)}/entries/${encodeURIComponent(entryId)}`);
    body.textContent = JSON.stringify(d, null, 2);
  } catch (e) {
    body.textContent = JSON.stringify(e.body || { error: e.message }, null, 2);
  }
}

$('#detailClose').onclick = () => $('#detailPanel').classList.remove('open');

function startSSE() {
  if (!state.appId || !state.sessionId) return;
  stopSSE();
  state.liveMode = true;
  $('#liveBtn').classList.add('on');
  const url = `${BASE}/api/v1/apps/${encodeURIComponent(state.appId)}/sessions/${encodeURIComponent(state.sessionId)}/stream`;
  const es = new EventSource(url);
  state.sse = es;
  es.onmessage = (msg) => {
    try {
      const ev = JSON.parse(msg.data);
      state.events.push(ev);
      if (state.events.length > 2000) state.events = state.events.slice(-1500);
      renderEvents();
    } catch {}
  };
  es.onerror = () => {
    if (state.liveMode) setTimeout(() => { if (state.liveMode) startSSE(); }, 3000);
  };
}

function stopSSE() {
  if (state.sse) { state.sse.close(); state.sse = null; }
  state.liveMode = false;
  $('#liveBtn').classList.remove('on');
}

$('#liveBtn').onclick = () => state.liveMode ? stopSSE() : startSSE();
$('#refreshBtn').onclick = () => { loadEvents(); loadSessions(); checkReady(); };

$('#appSelect').onchange = function() {
  state.appId = this.value;
  state.sessionId = null;
  stopSSE();
  loadSessions();
};

$('#filterType').onchange = loadEvents;
$('#filterSev').onchange = loadEvents;
let searchTimer;
$('#filterText').oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadEvents, 300); };

document.onkeydown = e => { if (e.key === 'Escape') $('#detailPanel').classList.remove('open'); };

checkReady();
loadApps();
setInterval(checkReady, 15000);
setInterval(() => { if (!state.liveMode && state.sessionId) loadEvents(); }, 30000);
setInterval(loadSessions, 20000);
</script>
</body>
</html>
